name: Mirror - Verify & Promote Image (reusable)

# Verifies one upstream image and, once approved, copies it to the mirror
# digest-preserving and together with Red Hat's signatures and attestations,
# then attaches a SLSA verification summary attestation (VSA). The
# vulnerability gate compares the image with the baseline, the digest the
# mirror stream tag points at (see .github/scripts/vuln-gate.sh). The VSA is
# issued to this workflow's identity, so consumers pin verification to
# `.github/workflows/verify-promote.yml@refs/heads/main`.

on:
  workflow_call:
    inputs:
      name:
        description: Mirror package name and tests/<name>/ directory
        required: true
        type: string
      source:
        description: Upstream reference pinned by digest (<repo>:<tag>@sha256:<digest>)
        required: true
        type: string
      mirror:
        description: Mirror repository prefix (e.g. ghcr.io/curantes/hummingbird-mirror)
        required: true
        type: string
      baseline:
        description: Digest the mirror stream tag points at (empty if the tag does not exist)
        required: false
        type: string
        default: ''
      promote:
        description: Copy the image to the mirror, attest and tag it
        required: false
        type: boolean
        default: false

permissions: {}

env:
  NAME: ${{ inputs.name }}
  SOURCE: ${{ inputs.source }}
  BASELINE: ${{ inputs.baseline }}
  MIRROR_IMAGE: ${{ inputs.mirror }}/${{ inputs.name }}
  # Red Hat release key 3 (https://security.access.redhat.com/data/63405576.txt)
  UPSTREAM_KEY: policy/keys/redhat-release3.pub
  VSA_PREDICATE: https://slsa.dev/verification_summary/v1
  # Pinned so that a scan is reproducible and a scanner update is a
  # reviewed change, not a side effect of an action update.
  # renovate: datasource=github-releases depName=anchore/syft
  SYFT_VERSION: v1.54.0
  # renovate: datasource=github-releases depName=anchore/grype
  GRYPE_VERSION: v0.118.0
  # renovate: datasource=github-releases depName=regclient/regclient
  REGCTL_VERSION: v0.11.7

jobs:
  verify:
    name: Verify Upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.parse.outputs.ref }}
      digest: ${{ steps.parse.outputs.digest }}
      tag: ${{ steps.parse.outputs.tag }}
      mode: ${{ steps.parse.outputs.mode }}
      version: ${{ steps.version.outputs.version }}
      suffix: ${{ steps.version.outputs.suffix }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse Source Reference
        id: parse
        run: |
          NAME_TAG="${SOURCE%%@*}"
          DIGEST="${SOURCE##*@}"
          REPO="${NAME_TAG%:*}"
          TAG="${NAME_TAG##*:}"
          if [[ "$DIGEST" != sha256:* || "$REPO" == "$NAME_TAG" || "$TAG" == */* ]]; then
            echo "Source must be <repo>:<tag>@sha256:<digest> (got: $SOURCE)"
            exit 1
          fi
          if [ ! -f "tests/$NAME/test.sh" ]; then
            echo "Missing tests/$NAME/test.sh"
            exit 1
          fi
          # The baseline is what consumers keep getting if this digest is
          # rejected, so it decides what the vulnerability gate checks:
          #   new-stream  no baseline: no fixable HIGH/CRITICAL findings
          #   refresh     baseline differs: no findings the baseline lacks
          #   audit       baseline is the pinned digest: report only
          if [ -z "$BASELINE" ]; then
            MODE=new-stream
          elif [[ ! "$BASELINE" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Baseline must be empty or a sha256 digest (got: $BASELINE)"
            exit 1
          elif [ "$BASELINE" = "$DIGEST" ]; then
            MODE=audit
          else
            MODE=refresh
          fi
          echo "Gate mode: $MODE (baseline: ${BASELINE:-none})"
          {
            echo "ref=$REPO@$DIGEST"
            echo "digest=$DIGEST"
            echo "tag=$TAG"
            echo "mode=$MODE"
          } >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify Red Hat Signature and SBOM Attestation
        # Red Hat signs with a long-lived key and does not upload to the public
        # Rekor log, hence --insecure-ignore-tlog (as documented upstream).
        env:
          REF: ${{ steps.parse.outputs.ref }}
        run: |
          # A platform-manifest pin would silently drop the other architectures.
          ARCHS="$(docker buildx imagetools inspect --raw "$REF" \
            | jq -r '[.manifests[]?.platform.architecture] | sort | join(",")')"
          if [[ ",$ARCHS," != *,amd64,* || ",$ARCHS," != *,arm64,* ]]; then
            echo "Source must be a multi-arch index with amd64 and arm64 (got: '${ARCHS:-single manifest}')"
            exit 1
          fi
          echo "Verifying $REF"
          cosign verify --key "$UPSTREAM_KEY" --insecure-ignore-tlog "$REF" > /dev/null
          cosign verify-attestation --key "$UPSTREAM_KEY" --insecure-ignore-tlog \
            --type spdx "$REF" > /dev/null

      # Guards against a digest that belongs to another stream (e.g. go:1.26
      # pinned to a 1.27.x image).
      - name: Resolve Upstream Version
        id: version
        env:
          REF: ${{ steps.parse.outputs.ref }}
          TAG: ${{ steps.parse.outputs.tag }}
        run: |
          STREAM="${TAG%%-*}"
          SUFFIX="${TAG#"$STREAM"}"
          VERSION=""
          if [[ "$STREAM" =~ ^[0-9] ]]; then
            # --no-tags skips listing every upstream tag; the registry
            # intermittently answers that with 502. Retry other transient errors.
            for attempt in 1 2 3; do
              if INSPECT="$(skopeo inspect --no-tags --override-os linux --override-arch amd64 "docker://$REF")"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "skopeo inspect failed after 3 attempts"
                exit 1
              fi
              echo "::warning::skopeo inspect failed (attempt $attempt); retrying"
              sleep $((attempt * 15))
            done
            VERSION="$(jq -r '.Labels["org.opencontainers.image.version"] // ""' <<< "$INSPECT")"
            if [[ "$VERSION" != "$STREAM."* ]]; then
              echo "Upstream version '$VERSION' does not belong to stream $STREAM"
              exit 1
            fi
          fi
          echo "Upstream version: ${VERSION:-n/a} (stream $STREAM${SUFFIX:+, variant ${SUFFIX#-}})"
          {
            echo "version=$VERSION"
            echo "suffix=$SUFFIX"
          } >> "$GITHUB_OUTPUT"

  test-scan:
    name: Test & Scan (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    env:
      REF: ${{ needs.verify.outputs.ref }}
      DIGEST: ${{ needs.verify.outputs.digest }}
      TAG: ${{ needs.verify.outputs.tag }}
      MODE: ${{ needs.verify.outputs.mode }}
      ARCH: ${{ matrix.arch }}
      TEST_IMAGE: local/${{ inputs.name }}:${{ needs.verify.outputs.tag }}-test
      BASELINE_IMAGE: local/${{ inputs.name }}:${{ needs.verify.outputs.tag }}-baseline
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull Upstream Image
        run: |
          docker pull --platform "linux/$ARCH" "$REF"
          docker tag "$REF" "$TEST_IMAGE"

      - name: Run Container Sanity Tests
        run: bash "tests/$NAME/test.sh" "$TEST_IMAGE" "$TAG"

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      - name: Generate Test SBOM
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: '"$SYFT" -q "docker:$TEST_IMAGE" -o syft-json=sbom.syft.json'

      # A scanner that doesn't recognise the distro sees no packages and
      # reports zero vulnerabilities (Trivy does this for Hummingbird OS).
      - name: Verify Package Detection
        run: |
          DISTRO="$(jq -r '.distro.id // ""' sbom.syft.json)"
          PKGS="$(jq '[.artifacts[] | select(.type == "rpm")] | length' sbom.syft.json)"
          echo "Detected distro '$DISTRO' with $PKGS RPM packages"
          if [ "$DISTRO" != "hummingbird" ] || [ "$PKGS" -eq 0 ]; then
            echo "Package detection failed; vulnerability results would be meaningless"
            exit 1
          fi
          # Language runtimes also ship packages outside RPM (pip, npm's
          # bundled modules, Composer's vendored dependencies) that the gate
          # must see. Rust is RPM-only; PHP ships Composer in builders only.
          case "$NAME:$TAG" in
            python:*) LANG_TYPE=python ;;
            nodejs:*) LANG_TYPE=npm ;;
            php:*-builder) LANG_TYPE=php-composer ;;
            *) LANG_TYPE="" ;;
          esac
          if [ -n "$LANG_TYPE" ]; then
            LANG_PKGS="$(jq --arg t "$LANG_TYPE" '[.artifacts[] | select(.type == $t)] | length' sbom.syft.json)"
            echo "Detected $LANG_PKGS $LANG_TYPE packages"
            if [ "$LANG_PKGS" -eq 0 ]; then
              echo "No $LANG_TYPE packages detected; the gate would miss language-level vulnerabilities"
              exit 1
            fi
          fi

      # The regression gate compares against what the mirror serves today,
      # so the baseline comes from the mirror, not from upstream.
      - name: Pull Baseline Image from Mirror
        if: needs.verify.outputs.mode == 'refresh'
        run: |
          if ! docker pull --platform "linux/$ARCH" "$MIRROR_IMAGE@$BASELINE"; then
            echo "::error::Cannot pull the baseline $MIRROR_IMAGE@$BASELINE for linux/$ARCH; the regression gate has nothing to compare with"
            exit 1
          fi
          docker tag "$MIRROR_IMAGE@$BASELINE" "$BASELINE_IMAGE"

      - name: Generate Baseline SBOM
        if: needs.verify.outputs.mode == 'refresh'
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          "$SYFT" -q "docker:$BASELINE_IMAGE" -o syft-json=baseline.syft.json
          # A baseline without detected packages would report no findings
          # and turn every finding of the new digest into a regression.
          DISTRO="$(jq -r '.distro.id // ""' baseline.syft.json)"
          PKGS="$(jq '[.artifacts[] | select(.type == "rpm")] | length' baseline.syft.json)"
          echo "Baseline: detected distro '$DISTRO' with $PKGS RPM packages"
          if [ "$DISTRO" != "hummingbird" ] || [ "$PKGS" -eq 0 ]; then
            echo "::error::Package detection failed on the baseline $MIRROR_IMAGE@$BASELINE; it cannot be compared with the new digest"
            exit 1
          fi

      - name: Install Grype
        id: grype-install
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          grype-version: ${{ env.GRYPE_VERSION }}

      # The DB download is occasionally reset mid-transfer, so fetch it here
      # with retries and scan against it without updating: both images are
      # then scanned with the same database.
      - name: Update Grype Database
        env:
          GRYPE: ${{ steps.grype-install.outputs.cmd }}
        run: |
          for attempt in 1 2 3; do
            "$GRYPE" db update && exit 0
            [ "$attempt" -lt 3 ] || { echo "Grype database update failed after 3 attempts"; exit 1; }
            echo "::warning::Grype database update failed (attempt $attempt); retrying"
            sleep $((attempt * 15))
          done

      # Unfixed vulnerabilities are left out, as before; the gate script
      # decides, so Grype itself never fails on findings here.
      - name: Vulnerability Scan (Grype)
        env:
          GRYPE: ${{ steps.grype-install.outputs.cmd }}
          GRYPE_DB_AUTO_UPDATE: "false"
        run: |
          "$GRYPE" -q sbom:sbom.syft.json --only-fixed \
            -o json=new.grype.json -o sarif=new.grype.sarif
          if [ "$MODE" = "refresh" ]; then
            "$GRYPE" -q sbom:baseline.syft.json --only-fixed -o json=baseline.grype.json
          fi

      - name: Upload Grype Scan Results to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('new.grype.sarif') != ''
        with:
          sarif_file: new.grype.sarif
          category: grype-${{ inputs.name }}-${{ needs.verify.outputs.tag }}-${{ matrix.arch }}

      - name: Vulnerability Gate
        env:
          GRYPE: ${{ steps.grype-install.outputs.cmd }}
        run: |
          ARGS=(--mode "$MODE" --new new.grype.json --result gate-result.json
            --summary "$GITHUB_STEP_SUMMARY" --label "$NAME:$TAG ($ARCH)")
          if [ "$MODE" = "refresh" ]; then ARGS+=(--baseline baseline.grype.json); fi
          .github/scripts/vuln-gate.sh "${ARGS[@]}"

          # What was checked, for the verification summary. Matrix job
          # outputs collide, so the promote job reads this as an artifact.
          GRYPE_VERSION="$("$GRYPE" version -o json | jq -r '.version')"
          GRYPE_DB_BUILT="$("$GRYPE" db status -o json | jq -r '.built')"
          jq --arg arch "$ARCH" --arg digest "$DIGEST" --arg baseline "$BASELINE" \
            --arg version "$GRYPE_VERSION" --arg built "$GRYPE_DB_BUILT" \
            '{
              architecture: $arch,
              digest: $digest,
              mode,
              baselineDigest: $baseline,
              pass,
              counts,
              grypeVersion: $version,
              grypeDbBuilt: $built
            }' gate-result.json > "gate-$ARCH.json"
          cat "gate-$ARCH.json"

      - name: Upload Gate Result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-${{ inputs.name }}-${{ needs.verify.outputs.tag }}-${{ matrix.arch }}
          path: gate-${{ matrix.arch }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  promote:
    name: Promote to Mirror
    needs: [verify, test-scan]
    if: inputs.promote && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write      # Keyless signing of the VSA via GitHub OIDC
      attestations: write  # Record the VSA
    env:
      REF: ${{ needs.verify.outputs.ref }}
      DIGEST: ${{ needs.verify.outputs.digest }}
      TAG: ${{ needs.verify.outputs.tag }}
      MODE: ${{ needs.verify.outputs.mode }}
      VERSION: ${{ needs.verify.outputs.version }}
      SUFFIX: ${{ needs.verify.outputs.suffix }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cosign first: the regctl installer verifies its download with it.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install regctl
        uses: regclient/actions/regctl-installer@dd58ad94f76adb73d8ac1bf75ed25f01545d5b32 # v0.2.0
        with:
          release: ${{ env.REGCTL_VERSION }}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Red Hat's SBOM attestation is a Sigstore bundle linked as an OCI
      # referrer. Upstream also carries a stale `sha256-<digest>` referrers
      # fallback tag without that bundle, so --digest-tags must not be used:
      # on registries without the referrers API (GHCR) it would overwrite the
      # index. Copy referrers, then only the cosign .sig/.att/.sbom tags.
      # --force-recursive repairs an index left incomplete by earlier copies;
      # regctl may then exit non-zero on unrelated upstream junk tags, so the
      # next step's verification is the gate, not regctl's exit code.
      - name: Copy Image with Signatures and Attestations
        run: |
          # GHCR rate-limits pushes (429) and can briefly deny pushes to a
          # package that is still being created (403), so retry the copy.
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              [ "$attempt" -lt 3 ] || return 1
              echo "::warning::Copy failed (attempt $attempt); retrying"
              sleep $((attempt * 15))
            done
          }
          # Once the image itself is on the mirror, remaining errors concern
          # referrers, which the verification step repairs.
          copied() { regctl image digest "$MIRROR_IMAGE@$DIGEST" > /dev/null 2>&1; }
          copy_image() {
            regctl image copy --referrers --force-recursive "$REF" "$MIRROR_IMAGE@$DIGEST" && return 0
            copied || return 1
            echo "::warning::regctl reported errors while copying referrers; relying on verification"
          }
          retry copy_image || { echo "Image copy failed after 3 attempts"; exit 1; }
          HEX="${DIGEST#sha256:}"
          for suffix in sig att sbom; do
            if regctl image digest "${REF%@*}:sha256-$HEX.$suffix" > /dev/null 2>&1; then
              retry regctl image copy "${REF%@*}:sha256-$HEX.$suffix" "$MIRROR_IMAGE:sha256-$HEX.$suffix"
            fi
          done

      - name: Verify Mirrored Copy
        run: |
          MIRRORED="$(regctl image digest "$MIRROR_IMAGE@$DIGEST")"
          if [ "$MIRRORED" != "$DIGEST" ]; then
            echo "Digest changed during copy: $MIRRORED != $DIGEST"
            exit 1
          fi
          cosign verify --key "$UPSTREAM_KEY" --insecure-ignore-tlog "$MIRROR_IMAGE@$DIGEST" > /dev/null
          # GHCR updates the referrers fallback index read-modify-write and can
          # serve a stale index, occasionally dropping the bundle; repair and retry.
          for attempt in 1 2 3; do
            if cosign verify-attestation --key "$UPSTREAM_KEY" --insecure-ignore-tlog \
                --type spdx "$MIRROR_IMAGE@$DIGEST" > /dev/null; then
              echo "Mirrored copy keeps digest $DIGEST and verifies with the Red Hat key"
              exit 0
            fi
            echo "::warning::SBOM attestation missing on mirror (attempt $attempt); repairing referrers"
            sleep $((attempt * 10))
            regctl image copy --referrers --force-recursive "$REF" "$MIRROR_IMAGE@$DIGEST" || true
          done
          cosign verify-attestation --key "$UPSTREAM_KEY" --insecure-ignore-tlog \
            --type spdx "$MIRROR_IMAGE@$DIGEST" > /dev/null

      - name: Check for Existing Approval
        id: approval
        run: |
          if gh attestation verify "oci://$MIRROR_IMAGE@$DIGEST" --bundle-from-oci \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/verify-promote.yml" \
              --predicate-type "$VSA_PREDICATE" > /dev/null 2>&1; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
            echo "Digest already approved; skipping a new verification summary"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Gate Results
        if: steps.approval.outputs.approved == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gate-${{ inputs.name }}-${{ needs.verify.outputs.tag }}-*
          path: gate
          merge-multiple: true

      # verifiedLevels state what was checked: a refresh is approved because
      # it adds no fixable HIGH/CRITICAL finding to what the mirror served,
      # a new stream because it has none. The VSA means "passed at promotion
      # time"; it does not expire and is not reissued by later audits.
      - name: Write Verification Summary
        if: steps.approval.outputs.approved == 'false'
        run: |
          case "$MODE" in
            refresh) VULN_LEVEL=NO_VULNERABILITY_REGRESSION ;;
            new-stream) VULN_LEVEL=NO_FIXABLE_HIGH_OR_CRITICAL_VULNERABILITIES ;;
            *)
              # audit: the stream tag already points at this digest, which
              # only happens after an approval. No vulnerability gate ran,
              # so there is nothing to attest.
              echo "::error::$MIRROR_IMAGE:$TAG points at $DIGEST, which has no approval; refusing to issue one without a vulnerability gate"
              exit 1
              ;;
          esac
          for arch in amd64 arm64; do
            if ! jq -e --arg digest "$DIGEST" --arg mode "$MODE" --arg baseline "$BASELINE" \
                '.pass == true and .digest == $digest and .mode == $mode and .baselineDigest == $baseline' \
                "gate/gate-$arch.json" > /dev/null; then
              echo "::error::Gate result for $arch is missing or does not match $DIGEST ($MODE, baseline ${BASELINE:-none})"
              exit 1
            fi
          done
          SCANS="$(jq -sc 'map({architecture, grypeVersion, grypeDbBuilt})' gate/gate-amd64.json gate/gate-arm64.json)"
          jq -n \
            --arg verifier "https://github.com/$GITHUB_REPOSITORY/.github/workflows/verify-promote.yml@$GITHUB_REF" \
            --arg time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg resource "oci://$REF" \
            --arg policy "https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/.github/workflows/verify-promote.yml" \
            --arg commit "$GITHUB_SHA" \
            --arg level "$VULN_LEVEL" \
            --arg mode "$MODE" \
            --arg baseline "$BASELINE" \
            --argjson scans "$SCANS" \
            '{
              verifier: { id: $verifier },
              timeVerified: $time,
              resourceUri: $resource,
              policy: { uri: $policy, digest: { gitCommit: $commit } },
              verificationResult: "PASSED",
              verifiedLevels: [
                "UPSTREAM_SIGNATURE_VERIFIED",
                "UPSTREAM_SBOM_ATTESTATION_VERIFIED",
                "SANITY_TESTS_PASSED",
                $level
              ],
              slsaVersion: "1.0",
              vulnerabilityGate: {
                mode: $mode,
                baselineDigest: (if $baseline == "" then null else $baseline end),
                scans: $scans
              }
            }' > vsa.json
          cat vsa.json

      - name: Attest Verification Summary (VSA)
        if: steps.approval.outputs.approved == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.MIRROR_IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          predicate-type: ${{ env.VSA_PREDICATE }}
          predicate-path: vsa.json
          push-to-registry: true

      # Tags move only after the approval exists, so a tag never points at an
      # unapproved digest. The timestamped tag is created once per approval
      # and never overwritten (GHCR has no tag immutability).
      - name: Move Tags
        id: tags
        env:
          APPROVED: ${{ steps.approval.outputs.approved }}
        run: |
          VERSION_TAG="${VERSION:+$VERSION$SUFFIX}"
          TAGS=("$TAG")
          if [ -n "$VERSION_TAG" ]; then TAGS+=("$VERSION_TAG"); fi
          if [ "$APPROVED" = "false" ]; then
            UNIQUE="${VERSION_TAG:-$TAG}-$(date -u +%Y%m%dT%H%M%SZ)"
            if regctl image digest "$MIRROR_IMAGE:$UNIQUE" > /dev/null 2>&1; then
              echo "Tag $UNIQUE already exists; refusing to overwrite"
              exit 1
            fi
            TAGS+=("$UNIQUE")
          fi
          for t in "${TAGS[@]}"; do
            regctl image copy "$MIRROR_IMAGE@$DIGEST" "$MIRROR_IMAGE:$t"
          done
          echo "tags=${TAGS[*]}" >> "$GITHUB_OUTPUT"

      - name: Write Job Summary
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          APPROVED: ${{ steps.approval.outputs.approved }}
        run: |
          {
            echo "### Promoted \`$MIRROR_IMAGE@$DIGEST\`"
            echo
            echo "Source: \`$REF\`"
            if [ "$APPROVED" = "true" ]; then echo; echo "Already approved; tags refreshed."; fi
            echo
            echo "Tags:"
            for t in $TAGS; do printf -- "- \`%s\`\n" "$t"; done
          } >> "$GITHUB_STEP_SUMMARY"
