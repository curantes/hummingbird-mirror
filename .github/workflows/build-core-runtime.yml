name: Factory - Core Runtime Image

on:
  push:
    branches: [ "main" ]
    paths:
      - 'images/core-runtime/**'
      - 'policy/keys/**'
      - '.github/workflows/build-image.yml'
      - '.github/workflows/build-core-runtime.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'images/core-runtime/**'
      - 'policy/keys/**'
      - '.github/workflows/build-image.yml'
      - '.github/workflows/build-core-runtime.yml'
  # Weekly re-audit: re-verifies the upstream signature and rescans for newly
  # disclosed CVEs. Base image updates arrive as Renovate digest bumps.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  factory:
    name: Core Runtime
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      image: core-runtime
      publish: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
