name: Factory - Build Image (reusable)

# Single isolated build definition shared by every image. All signatures and
# attestations are issued to this workflow's identity, so consumers pin
# verification to `.github/workflows/build-image.yml@refs/heads/main`.

on:
  workflow_call:
    inputs:
      image:
        description: Directory under images/ and GHCR package name
        required: true
        type: string
      publish:
        description: Push, sign and attest the image
        required: false
        type: boolean
        default: false

permissions: {}

env:
  CONTEXT: images/${{ inputs.image }}
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}/${{ inputs.image }}
  # Red Hat release key 3 (https://security.access.redhat.com/data/63405576.txt)
  UPSTREAM_KEY: policy/keys/redhat-release3.pub

jobs:
  verify-upstream:
    name: Verify Upstream Base Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify Red Hat Signature and SBOM Attestation
        # Red Hat signs with a long-lived key and does not upload to the public
        # Rekor log, hence --insecure-ignore-tlog (as documented upstream).
        run: |
          BASE="$(awk 'toupper($1) == "FROM" { print $2; exit }' "$CONTEXT/Containerfile")"
          if [[ "$BASE" != *@sha256:* ]]; then
            echo "Base image must be pinned by digest: $BASE"
            exit 1
          fi
          # A platform-manifest pin would silently drop the other architectures.
          ARCHS="$(docker buildx imagetools inspect --raw "$BASE" \
            | jq -r '[.manifests[]?.platform.architecture] | sort | join(",")')"
          if [[ ",$ARCHS," != *,amd64,* || ",$ARCHS," != *,arm64,* ]]; then
            echo "Base must be a multi-arch index with amd64 and arm64 (got: '${ARCHS:-single manifest}')"
            exit 1
          fi
          echo "Verifying $BASE"
          cosign verify --key "$UPSTREAM_KEY" --insecure-ignore-tlog "$BASE" > /dev/null
          cosign verify-attestation --key "$UPSTREAM_KEY" --insecure-ignore-tlog \
            --type spdx "$BASE" > /dev/null

  lint:
    name: Lint Containerfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Containerfile (Hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ env.CONTEXT }}/Containerfile

  build-test:
    name: Build, Test & Audit (${{ matrix.arch }})
    needs: verify-upstream
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      security-events: write
    env:
      TEST_IMAGE: local/${{ inputs.image }}:test
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Local Image for Testing and Audit
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/Containerfile
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.TEST_IMAGE }}

      - name: Run Container Sanity Tests
        run: bash "$CONTEXT/test.sh" "$TEST_IMAGE"

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Generate Test SBOM
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: '"$SYFT" -q "docker:$TEST_IMAGE" -o syft-json=sbom.syft.json'

      # A scanner that doesn't recognise the distro sees no packages and
      # reports zero vulnerabilities (Trivy does this for Hummingbird OS).
      - name: Verify Package Detection
        run: |
          DISTRO="$(jq -r '.distro.id // ""' sbom.syft.json)"
          PKGS="$(jq '[.artifacts[] | select(.type == "rpm")] | length' sbom.syft.json)"
          echo "Detected distro '$DISTRO' with $PKGS RPM packages"
          if [ "$DISTRO" != "hummingbird" ] || [ "$PKGS" -eq 0 ]; then
            echo "Package detection failed; vulnerability results would be meaningless"
            exit 1
          fi

      - name: Vulnerability Scan & Gate (Grype, fixable HIGH+)
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.syft.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: sarif

      - name: Upload Grype Scan Results to GitHub Security
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always() && steps.grype.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-${{ inputs.image }}-${{ matrix.arch }}

  publish:
    name: Publish & Sign Multi-Arch Image
    needs: [lint, build-test]
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # Keyless signing via GitHub OIDC
      attestations: write  # Record build provenance attestations
    outputs:
      digest: ${{ steps.build-push.outputs.digest }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The timestamped tag identifies exactly one build. GHCR has no tag
      # immutability, so refuse to overwrite an existing one.
      - name: Resolve Build Tag and Base Digest
        id: stamp
        run: |
          BUILD_TAG="latest-$(date -u +%Y%m%dT%H%M%SZ)"
          if docker buildx imagetools inspect "$REGISTRY_IMAGE:$BUILD_TAG" > /dev/null 2>&1; then
            echo "Tag $BUILD_TAG already exists; refusing to overwrite"
            exit 1
          fi
          BASE="$(awk 'toupper($1) == "FROM" { print $2; exit }' "$CONTEXT/Containerfile")"
          {
            echo "build_tag=$BUILD_TAG"
            echo "base_digest=${BASE##*@}"
          } >> "$GITHUB_OUTPUT"

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.stamp.outputs.build_tag }}
          labels: |
            org.opencontainers.image.version=${{ steps.stamp.outputs.build_tag }}
            org.opencontainers.image.base.digest=${{ steps.stamp.outputs.base_digest }}

      # Containerfiles only set metadata (no RUN), so cross-platform builds
      # need no emulation.
      - name: Build and Push Image
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Provenance and SBOMs are attested separately below; keep the index
          # free of BuildKit attestation manifests.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Image (Cosign keyless)
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: cosign sign --yes --recursive "$REGISTRY_IMAGE@$DIGEST"

      - name: Generate Artifact Attestation (SLSA Provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Write Job Summary
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published \`$REGISTRY_IMAGE@$DIGEST\`"
            echo
            echo "Tags:"
            while read -r tag; do printf -- "- \`%s\`\n" "$tag"; done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

  sbom:
    name: Attest SBOM (${{ matrix.arch }})
    needs: publish
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # SBOMs describe a single platform, so attach each one to its
      # platform manifest rather than to the index.
      - name: Resolve Platform Digest
        id: platform
        env:
          INDEX_DIGEST: ${{ needs.publish.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          DIGEST="$(docker buildx imagetools inspect --raw "$REGISTRY_IMAGE@$INDEX_DIGEST" \
            | jq -r --arg arch "$ARCH" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')"
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Generate Syft SBOM (SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY_IMAGE }}@${{ steps.platform.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ inputs.image }}-${{ matrix.arch }}.spdx.json
          upload-artifact: false

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.platform.outputs.digest }}
          sbom-path: sbom-${{ inputs.image }}-${{ matrix.arch }}.spdx.json
          push-to-registry: true

      - name: Upload SBOM as Run Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ inputs.image }}-${{ matrix.arch }}
          path: sbom-${{ inputs.image }}-${{ matrix.arch }}.spdx.json

