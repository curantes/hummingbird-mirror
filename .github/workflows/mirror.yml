name: Mirror - Hardened Images

on:
  push:
    branches: [ "main" ]
    paths:
      - 'mirror/**'
      - 'tests/**'
      - 'policy/keys/**'
      - '.github/scripts/**'
      - '.github/workflows/mirror.yml'
      - '.github/workflows/verify-promote.yml'
  # Runs on every PR so the required "Mirror Result" check always reports;
  # the plan job skips verification when no mirror inputs changed.
  pull_request:
    branches: [ "main" ]
  # Weekly re-audit of every approved digest: re-verifies the upstream
  # signature, reports newly disclosed CVEs, and promotes entries whose
  # stream tag doesn't point at the pinned digest yet.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  # Mirror destination; the promote job logs in to its registry.
  MIRROR: ghcr.io/curantes/hummingbird-mirror

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read  # Resolves the digest behind each mirror stream tag
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      matrix: ${{ steps.plan.outputs.matrix }}
      mirror: ${{ steps.plan.outputs.mirror }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so PRs and pushes can diff against their base commit
          fetch-depth: 0

      # Cosign first: the regctl installer verifies its download with it.
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install regctl
        uses: regclient/actions/regctl-installer@dd58ad94f76adb73d8ac1bf75ed25f01545d5b32 # v0.2.0
        with:
          release: v0.11.7

      # The mirror packages are public, so PR runs read them anonymously.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PRs and pushes check entries whose source changed or whose tests
      # changed; pushes also retry entries not promoted yet. Pipeline changes,
      # the weekly re-audit and manual runs check every entry.
      #
      # Each entry gets a baseline: the digest its mirror stream tag points
      # at, which is what consumers keep getting if the pinned digest is
      # rejected. verify-promote.yml derives the gate mode from it. An entry
      # is promoted on manual runs, and on pushes and scheduled runs when the
      # stream tag doesn't point at the pinned digest.
      - name: Plan Images
        id: plan
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          ALL="$(yq -o=json -I=0 '.images' mirror/images.yaml \
            | jq -c 'map({name, source} + {tag: (.source | split("@")[0] | split(":") | last), digest: (.source | split("@") | last)})')"
          DUPES="$(jq -r 'group_by(.name + ":" + .tag) | map(select(length > 1) | .[0].name + ":" + .[0].tag) | join(", ")' <<< "$ALL")"
          if [ -n "$DUPES" ]; then
            echo "Duplicate mirror tags in mirror/images.yaml: $DUPES"
            exit 1
          fi

          case "$GITHUB_EVENT_NAME" in
            pull_request) BASE="$PR_BASE" ;;
            push) BASE="$PUSH_BEFORE" ;;
            *) BASE="" ;;
          esac
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            MATRIX="$ALL"
            echo "Full run ($GITHUB_EVENT_NAME): checking every entry."
          else
            # Outside any `if` so a failed diff fails the job instead of skipping
            CHANGED_FILES="$(git diff --name-only "$BASE" HEAD)"
            if grep -qE '^(policy/keys/|\.github/scripts/|\.github/workflows/(mirror|verify-promote)\.yml$)' <<< "$CHANGED_FILES"; then
              MATRIX="$ALL"
              echo "Pipeline changed: checking every entry."
            else
              # A missing base allowlist means every entry is new
              BASE_SOURCES="$(git show "$BASE:mirror/images.yaml" 2>/dev/null \
                | yq -o=json -I=0 '[.images[].source]' || echo '[]')"
              TESTS="$({ grep -oP '^tests/\K[^/]+(?=/)' <<< "$CHANGED_FILES" || true; } | jq -Rsc 'split("\n") | map(select(. != ""))')"
              MATRIX="$(jq -c --argjson old "$BASE_SOURCES" --argjson tests "$TESTS" \
                'map(select((.source | IN($old[]) | not) or (.name | IN($tests[]))))' <<< "$ALL")"
              echo "Checking entries with a new source or changed tests."
            fi
          fi

          # Fallback for PR runs that can't read the mirror anonymously: the
          # digest pinned for the same name and tag in the base commit.
          BASE_DIGESTS='{}'
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_DIGESTS="$(git show "$PR_BASE:mirror/images.yaml" 2>/dev/null \
              | yq -o=json -I=0 '.images' \
              | jq -c 'map({(.name + ":" + (.source | split("@")[0] | split(":") | last)): (.source | split("@") | last)}) | add // {}' \
              || echo '{}')"
          fi
          baseline() {
            local name="$1" tag="$2"
            if regctl image digest "$MIRROR/$name:$tag" < /dev/null 2> /dev/null; then
              return 0
            fi
            # The tag can't be read. If the repository can be listed, the
            # tag doesn't exist: no baseline. Otherwise the package is new
            # or the anonymous read failed, so PRs use the base commit.
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ] \
                && ! regctl tag ls "$MIRROR/$name" < /dev/null > /dev/null 2>&1; then
              jq -r --arg k "$name:$tag" '.[$k] // ""' <<< "$BASE_DIGESTS"
            fi
          }

          # Only one run per concurrency group can be pending, so a push run
          # can be cancelled before it starts and its entries would never be
          # retried. Tags move only after approval, so a stream tag that
          # doesn't point at the pinned digest (or can't be read) marks an
          # entry that still needs promoting. Pushes therefore resolve the
          # baseline of every entry, other events only of the selected ones.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then TARGET="$ALL"; else TARGET="$MATRIX"; fi
          BASELINES="$(jq -r '.[] | "\(.name) \(.tag)"' <<< "$TARGET" \
            | while read -r name tag; do
                jq -nc --arg k "$name:$tag" --arg d "$(baseline "$name" "$tag")" '{($k): $d}'
              done | jq -sc 'add // {}')"
          MATRIX="$(jq -c --argjson m "$MATRIX" --argjson b "$BASELINES" --arg event "$GITHUB_EVENT_NAME" '
            map((.name + ":" + .tag) as $k
              | select(IN($m[]) or ($event == "push" and $b[$k] != .digest))
              | . + {baseline: ($b[$k] // "")}
              | . + {promote: ($event == "workflow_dispatch"
                  or (($event == "push" or $event == "schedule") and .baseline != .digest))})' <<< "$ALL")"

          jq -r '.[] | "- \(.name):\(.tag) baseline=\(if .baseline == "" then "none" elif .baseline == .digest then "pinned digest" else .baseline end) promote=\(.promote)"' <<< "$MATRIX"
          {
            echo "changed=$(jq 'length > 0' <<< "$MATRIX")"
            echo "matrix=$MATRIX"
            echo "mirror=$MIRROR"
          } >> "$GITHUB_OUTPUT"

  gate-tests:
    name: Gate Script Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the Vulnerability Gate
        run: .github/scripts/tests/vuln-gate-test.sh

  verify-promote:
    name: ${{ matrix.image.name }}:${{ matrix.image.tag }}
    needs: [plan, gate-tests]
    if: needs.plan.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/verify-promote.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      name: ${{ matrix.image.name }}
      source: ${{ matrix.image.source }}
      mirror: ${{ needs.plan.outputs.mirror }}
      baseline: ${{ matrix.image.baseline }}
      promote: ${{ matrix.image.promote }}

  # Single stable check for branch protection; matrix job names change as
  # images are added.
  result:
    name: Mirror Result
    needs: [plan, gate-tests, verify-promote]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check Mirror Jobs
        env:
          CHANGED: ${{ needs.plan.outputs.changed }}
          PLAN: ${{ needs.plan.result }}
          GATE_TESTS: ${{ needs.gate-tests.result }}
          VERIFY: ${{ needs.verify-promote.result }}
        run: |
          echo "plan=$PLAN gate-tests=$GATE_TESTS verify-promote=$VERIFY changed=$CHANGED"
          [ "$PLAN" = "success" ] || exit 1
          [ "$GATE_TESTS" = "success" ] || exit 1
          if [ "$CHANGED" = "true" ]; then
            [ "$VERIFY" = "success" ]
          else
            [ "$VERIFY" = "skipped" ]
          fi

  # Re-audits and promotions run unattended (Renovate automerges digest
  # refreshes), so track failures in one issue. Vulnerabilities in an
  # approved digest are reported, not failed, so the issue marks real
  # failures: signature, tests, package detection, regressions, promotion.
  # Pushes retry entries not promoted yet but don't recheck approved
  # digests, so only a full run (weekly re-audit or manual) closes it.
  alert:
    name: Alert on Failure
    needs: result
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or Close Alert Issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.result.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABEL: mirror-alert
        run: |
          ISSUE="$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')"
          if [ "$RESULT" = "success" ]; then
            if [ -n "$ISSUE" ] && [ "$GITHUB_EVENT_NAME" != "push" ]; then
              gh issue close "$ISSUE" --comment "Recovered: the $GITHUB_EVENT_NAME run passed. $RUN_URL"
            fi
            exit 0
          fi
          MESSAGE="The $GITHUB_EVENT_NAME run on \`$GITHUB_REF_NAME\` failed: $RUN_URL"
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "$MESSAGE"
          else
            gh label create "$LABEL" --color B60205 --description "Mirror re-audit or promotion failed" --force
            gh issue create --title "Mirror run failing on main" --label "$LABEL" --body "$MESSAGE

          An approved digest may have failed re-verification, its tests or package detection, a pinned digest may add fixable HIGH/CRITICAL vulnerabilities that the mirrored one does not have, or a promotion did not complete. Mirror tags stay on the last approved digest until a run passes. Pushes retry entries that aren't promoted yet but don't recheck approved digests, so run the workflow manually to re-check every entry. This issue closes automatically when the next full run (manual or weekly re-audit) passes."
          fi
