name: Mirror - Hardened Images

on:
  push:
    branches: [ "main" ]
    paths:
      - 'mirror/**'
      - 'tests/**'
      - 'policy/keys/**'
      - '.github/workflows/mirror.yml'
      - '.github/workflows/verify-promote.yml'
  # Runs on every PR so the required "Mirror Result" check always reports;
  # the plan job skips verification when no mirror inputs changed.
  pull_request:
    branches: [ "main" ]
  # Weekly re-audit of every approved digest: re-verifies the upstream
  # signature and rescans for newly disclosed CVEs without promoting.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  # Mirror destination; the promote job logs in to its registry.
  MIRROR: ghcr.io/curantes/hummingbird-mirror

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read  # Pushes compare mirror tags with the allowlist
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      matrix: ${{ steps.plan.outputs.matrix }}
      mirror: ${{ steps.plan.outputs.mirror }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so PRs and pushes can diff against their base commit
          fetch-depth: 0

      # Cosign first: the regctl installer verifies its download with it.
      - name: Install Cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install regctl
        if: github.event_name == 'push'
        uses: regclient/actions/regctl-installer@dd58ad94f76adb73d8ac1bf75ed25f01545d5b32 # v0.2.0
        with:
          release: v0.11.7

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PRs and pushes check entries whose source changed or whose tests
      # changed; pushes also retry entries not promoted yet. Pipeline changes,
      # the weekly re-audit and manual runs check every entry.
      - name: Plan Images
        id: plan
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          ALL="$(yq -o=json -I=0 '.images' mirror/images.yaml \
            | jq -c 'map({name, source} + {tag: (.source | split("@")[0] | split(":") | last)})')"
          DUPES="$(jq -r 'group_by(.name + ":" + .tag) | map(select(length > 1) | .[0].name + ":" + .[0].tag) | join(", ")' <<< "$ALL")"
          if [ -n "$DUPES" ]; then
            echo "Duplicate mirror tags in mirror/images.yaml: $DUPES"
            exit 1
          fi

          case "$GITHUB_EVENT_NAME" in
            pull_request) BASE="$PR_BASE" ;;
            push) BASE="$PUSH_BEFORE" ;;
            *) BASE="" ;;
          esac
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            MATRIX="$ALL"
            echo "Full run ($GITHUB_EVENT_NAME): checking every entry."
          else
            # Outside any `if` so a failed diff fails the job instead of skipping
            CHANGED_FILES="$(git diff --name-only "$BASE" HEAD)"
            if grep -qE '^(policy/keys/|\.github/workflows/(mirror|verify-promote)\.yml$)' <<< "$CHANGED_FILES"; then
              MATRIX="$ALL"
              echo "Pipeline changed: checking every entry."
            else
              # A missing base allowlist means every entry is new
              BASE_SOURCES="$(git show "$BASE:mirror/images.yaml" 2>/dev/null \
                | yq -o=json -I=0 '[.images[].source]' || echo '[]')"
              TESTS="$({ grep -oP '^tests/\K[^/]+(?=/)' <<< "$CHANGED_FILES" || true; } | jq -Rsc 'split("\n") | map(select(. != ""))')"
              MATRIX="$(jq -c --argjson old "$BASE_SOURCES" --argjson tests "$TESTS" \
                'map(select((.source | IN($old[]) | not) or (.name | IN($tests[]))))' <<< "$ALL")"
              echo "Checking entries with a new source or changed tests."
            fi
          fi

          # Only one run per concurrency group can be pending, so a push run
          # can be cancelled before it starts and its entries would never be
          # retried. Tags move only after approval, so a stream tag that
          # doesn't point at the pinned digest (or can't be read) marks an
          # entry that still needs promoting.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            UNPROMOTED="$(jq -r --argjson m "$MATRIX" '.[] | select(IN($m[]) | not) | "\(.name) \(.tag) \(.source | split("@") | last)"' <<< "$ALL" \
              | while read -r name tag digest; do
                  if [ "$(regctl image digest "$MIRROR/$name:$tag" 2> /dev/null)" != "$digest" ]; then
                    echo "$name:$tag"
                  fi
                done | jq -Rsc 'split("\n") | map(select(. != ""))')"
            if [ "$UNPROMOTED" != "[]" ]; then
              echo "Retrying entries not promoted yet: $(jq -r 'join(", ")' <<< "$UNPROMOTED")"
              MATRIX="$(jq -c --argjson m "$MATRIX" --argjson u "$UNPROMOTED" \
                'map(select(IN($m[]) or ((.name + ":" + .tag) | IN($u[]))))' <<< "$ALL")"
            fi
          fi

          jq -r '.[] | "- \(.name):\(.tag)"' <<< "$MATRIX"
          {
            echo "changed=$(jq 'length > 0' <<< "$MATRIX")"
            echo "matrix=$MATRIX"
            echo "mirror=$MIRROR"
          } >> "$GITHUB_OUTPUT"

  verify-promote:
    name: ${{ matrix.image.name }}:${{ matrix.image.tag }}
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/verify-promote.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      name: ${{ matrix.image.name }}
      source: ${{ matrix.image.source }}
      mirror: ${{ needs.plan.outputs.mirror }}
      promote: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

  # Single stable check for branch protection; matrix job names change as
  # images are added.
  result:
    name: Mirror Result
    needs: [plan, verify-promote]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check Mirror Jobs
        env:
          CHANGED: ${{ needs.plan.outputs.changed }}
          PLAN: ${{ needs.plan.result }}
          VERIFY: ${{ needs.verify-promote.result }}
        run: |
          echo "plan=$PLAN verify-promote=$VERIFY changed=$CHANGED"
          [ "$PLAN" = "success" ] || exit 1
          if [ "$CHANGED" = "true" ]; then
            [ "$VERIFY" = "success" ]
          else
            [ "$VERIFY" = "skipped" ]
          fi

  # Re-audits and promotions run unattended (Renovate automerges digest
  # refreshes), so track failures in one issue. Pushes retry entries not
  # promoted yet but don't recheck approved digests, so only a full run
  # (weekly re-audit or manual) closes it.
  alert:
    name: Alert on Failure
    needs: result
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or Close Alert Issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.result.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABEL: mirror-alert
        run: |
          ISSUE="$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')"
          if [ "$RESULT" = "success" ]; then
            if [ -n "$ISSUE" ] && [ "$GITHUB_EVENT_NAME" != "push" ]; then
              gh issue close "$ISSUE" --comment "Recovered: the $GITHUB_EVENT_NAME run passed. $RUN_URL"
            fi
            exit 0
          fi
          MESSAGE="The $GITHUB_EVENT_NAME run on \`$GITHUB_REF_NAME\` failed: $RUN_URL"
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "$MESSAGE"
          else
            gh label create "$LABEL" --color B60205 --description "Mirror re-audit or promotion failed" --force
            gh issue create --title "Mirror run failing on main" --label "$LABEL" --body "$MESSAGE

          Approved digests may have failed re-verification or picked up a fixable HIGH/CRITICAL CVE, or a promotion did not complete. Mirror tags stay on the last approved digest until a run passes. Pushes retry entries that aren't promoted yet but don't recheck approved digests, so run the workflow manually to re-check every entry. This issue closes automatically when the next full run (manual or weekly re-audit) passes."
          fi
