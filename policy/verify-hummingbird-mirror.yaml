apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-hummingbird-mirror
  annotations:
    policies.kyverno.io/title: Verify Mirrored Hummingbird Images
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.13.0
    policies.kyverno.io/description: >-
      Admits images from ghcr.io/curantes/hummingbird-mirror/* only when
      they carry Red Hat's original signature (release key 3) and a passing SLSA
      verification summary attestation issued by the verify-promote workflow on main.
spec:
  validationFailureAction: Enforce
  background: true
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-upstream-signature-and-approval
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        # Red Hat's signature, copied with the image (cosign .sig format)
        - imageReferences:
            - "ghcr.io/curantes/hummingbird-mirror/*"
          mutateDigest: true
          verifyDigest: true
          attestors:
            - entries:
                - keys:
                    publicKeys: |-
                      -----BEGIN PUBLIC KEY-----
                      MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA0ASyuH2TLWvBUqPHZ4Ip
                      75g7EncBkgQHdJnjzxAW5KQTMh/siBoB/BoSrtiPMwnChbTCnQOIQeZuDiFnhuJ7
                      M/D3b7JoX0m123NcCSn67mAdjBa6Bg6kukZgCP4ZUZeESajWX/EjylFcRFOXW57p
                      RDCEN42J/jYlVqt+g9+Grker8Sz86H3l0tbqOdjbz/VxHYhwF0ctUMHsyVRDq2QP
                      tqzNXlmlMhS/PoFr6R4u/7HCn/K+LegcO2fAFOb40KvKSKKVD6lewUZErhop1CgJ
                      XjDtGmmO9dGMF71mf6HEfaKSdy+EE6iSF2A2Vv9QhBawMiq2kOzEiLg4nAdJT8wg
                      ZrMAmPCqGIsXNGZ4/Q+YTwwlce3glqb5L9tfNozEdSR9N85DESfQLQEdY3CalwKM
                      BT1OEhEX1wHRCU4drMOej6BNW0VtscGtHmCrs74jPezhwNT8ypkyS+T0zT4Tsy6f
                      VXkJ8YSHyenSzMB2Op2bvsE3grY+s74WhG9UIA6DBxcTie15NSzKwfzaoNWODcLF
                      p7BY8aaHE2MqFxYFX+IbjpkQRfaeQQsouDFdCkXEFVfPpbD2dk6FleaMTPuyxtIT
                      gjVEtGQK2qGCFGiQHFd4hfV+eCA63Jro1z0zoBM5BbIIQ3+eVFwt3AlZp5UVwr6d
                      secqki/yrmv3Y0dqZ9VOn3UCAwEAAQ==
                      -----END PUBLIC KEY-----
                    # Red Hat does not upload to the public Rekor log
                    rekor:
                      ignoreTlog: true
                    ctlog:
                      ignoreSCT: true
        # Our approval: VSA stored as a Sigstore bundle (OCI referrer)
        - imageReferences:
            - "ghcr.io/curantes/hummingbird-mirror/*"
          type: SigstoreBundle
          attestations:
            - predicateType: https://slsa.dev/verification_summary/v1
              attestors:
                - entries:
                    - keyless:
                        issuer: https://token.actions.githubusercontent.com
                        subject: "https://github.com/curantes/hummingbird-mirror/.github/workflows/verify-promote.yml@refs/heads/main"
                        rekor:
                          url: https://rekor.sigstore.dev
              conditions:
                - all:
                    - key: "{{ verificationResult }}"
                      operator: Equals
                      value: PASSED
