# Upstream Red Hat Hardened Images (Hummingbird) approved for mirroring.
#
# Each entry is verified (Red Hat signature + SBOM attestation, multi-arch,
# version stream), tested (tests/<name>/test.sh) and scanned (Grype) before it
# is copied, digest-preserving and with its signatures, to the mirror and given
# our verification summary attestation.
#
# Renovate refreshes the digests; the tag after the image name follows one
# upstream version stream and never changes. Streams are the ones of Red Hat's
# catalog: rust has the single stream 1 (tag 1), go one per minor version
# (tags 1.26, 1.27). Add a stream by adding an entry.
#
# Entries are grouped by the category of Red Hat's catalog
# (https://images.redhat.com/) and sorted alphabetically within each group,
# matching the README.
